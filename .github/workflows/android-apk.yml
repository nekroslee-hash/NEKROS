name: Build NEKROS Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project scaffold
        run: |
          flutter create --platforms=android --org com.nekros --project-name nekros /tmp/nekros_android
          cp mobile/pubspec.yaml /tmp/nekros_android/pubspec.yaml
          rm -rf /tmp/nekros_android/lib
          cp -r mobile/lib /tmp/nekros_android/lib

      - name: Resolve packages
        working-directory: /tmp/nekros_android
        run: flutter pub get

      - name: Build release APK
        working-directory: /tmp/nekros_android
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nekros-android-apk
          path: /tmp/nekros_android/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
